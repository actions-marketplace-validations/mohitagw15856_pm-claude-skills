# Model Day-One: run SkillBench the day a new model ships, then publish a
# launch-day verdict saying, skill by skill, whether each one still helps that
# model (scripts/launch-verdict.mjs). MANUAL ONLY: a run spends the owner's API
# credit (about $2 to $5), so it is never scheduled or triggered automatically.
# The report arrives as a pull request, because main is protected.
name: Model Day-One report
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'The new model id (e.g. claude-fable-5, gpt-5.2, or a free route such as modelscope:Qwen/Qwen3-32B)'
        required: true
      baseline:
        description: 'Model to compare with (default: the most recent other run)'
        required: false
concurrency: { group: model-day-one, cancel-in-progress: false }
jobs:
  bench:
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    env:
      # Inputs reach the shell only through the environment, never interpolated into scripts.
      MODEL: ${{ inputs.model }}
      BASELINE: ${{ inputs.baseline }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - name: Check the model id
        run: |
          printf '%s' "$MODEL" | grep -Eq '^[A-Za-z0-9._:/-]{2,100}$' || { echo "::error::model ids are letters, digits and . _ : / - only"; exit 1; }
          [ -z "${BASELINE:-}" ] || printf '%s' "$BASELINE" | grep -Eq '^[A-Za-z0-9._:/-]{2,100}$' || { echo "::error::baseline has the same rules"; exit 1; }
      - name: Run SkillBench on the new model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: node skillbench/run-skillbench.mjs --models "$MODEL"
      - name: Write the launch-day verdict
        run: |
          set -euo pipefail
          if [ -n "${BASELINE:-}" ]; then node scripts/launch-verdict.mjs --model "$MODEL" --baseline "$BASELINE"
          else node scripts/launch-verdict.mjs --model "$MODEL"; fi
      - name: Open a pull request with the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          safe=$(printf '%s' "$MODEL" | tr -c 'A-Za-z0-9.-' '_')
          branch="bench/day-one-$safe-$(date -u +%Y%m%d%H%M)"
          git config user.name 'day-one-bot'; git config user.email 'actions@github.com'
          git switch -c "$branch"
          git add skillbench
          printf 'bench: launch-day verdict for %s\n' "$MODEL" > /tmp/msg
          git commit -q -F /tmp/msg
          git push -q -u origin "$branch"
          report=$(ls -t skillbench/reports/verdict-*.md | head -1)
          gh pr create --base main --head "$branch" --title "bench: launch-day verdict for $MODEL" --body-file "$report"
